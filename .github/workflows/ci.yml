name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gamdap
          POSTGRES_USER: gamdap
          POSTGRES_PASSWORD: gamdap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamdap -d gamdap"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GAMDAP_DB_HOST: localhost
      GAMDAP_DB_PORT: "5432"
      GAMDAP_DB_NAME: gamdap
      GAMDAP_DB_USER: gamdap
      GAMDAP_DB_PASSWORD: gamdap
      GAMDAP_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run migrations against real Postgres
        run: python -m gamdap.cli migrate

      - name: Verify schema is idempotent (re-run)
        run: python -m gamdap.cli migrate

      - name: Tests
        run: pytest -q

      - name: Type check (non-blocking)
        continue-on-error: true
        run: mypy src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gamdap:ci .
