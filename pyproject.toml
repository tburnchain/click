[project]
name = "gamdap"
version = "0.1.0"
description = "Global Affiliate Marketing Data Aggregation Platform — 수집·정규화·분류·분석 코어"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "tenacity>=8.4",
    "structlog>=24.1",
    "celery>=5.4",
    "redis>=5.0",
    "python-dateutil>=2.9",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
gamdap-migrate = "gamdap.cli:migrate"
gamdap-ingest = "gamdap.cli:ingest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamdap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: SQL 문자열이 많아 줄길이 강제는 실익이 적음
# B008: FastAPI Depends()/Query() 를 기본 인자로 쓰는 정상 패턴을 오탐
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
